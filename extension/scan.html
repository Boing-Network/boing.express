<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan QR · Boing Express</title>
  <link rel="stylesheet" href="popup-islands.css" />
  <link rel="stylesheet" href="popup-islands2.css" />
  <style>
    body { margin: 0; min-height: 100vh; background: #040814; color: #E8F0FF; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    #scan-root { width: 100%; max-width: 440px; }
    .done { text-align: center; }
    /* Extension only: hidden scrollbars, scrolling kept. */
    html, body, * { scrollbar-width: none !important; }
    html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
  </style>
</head>
<body>
  <div id="scan-root"></div>
  <script src="scan.js" type="module"></script>
</body>
</html>
